<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle power ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-dasharray="24 16"/>
  <circle cx="256" cy="256" r="160" fill="#0f172a" fill-opacity="0.6" stroke="#10b981" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Core Generator Power Bolt -->
  <path d="M280 90 L180 260 L260 260 L232 422 L352 232 L272 232 Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)"/>

  <!-- Industrial Gear / Stator accents -->
  <rect x="246" y="56" width="20" height="20" rx="4" fill="#34d399" opacity="0.8"/>
  <rect x="246" y="436" width="20" height="20" rx="4" fill="#34d399" opacity="0.8"/>
  <rect x="56" y="246" width="20" height="20" rx="4" fill="#34d399" opacity="0.8"/>
  <rect x="436" y="246" width="20" height="20" rx="4" fill="#34d399" opacity="0.8"/>
</svg>
