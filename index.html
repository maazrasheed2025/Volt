<!doctype html>
<html lang="en">
  <head>
    <script>
      // Suppress Vite HMR WebSocket connection errors in cloud dev iframe environment
      (function () {
        function isViteHmrError(err) {
          if (!err) return false;
          var str = '';
          if (typeof err === 'string') str = err;
          else if (err instanceof Error) str = (err.message || '') + ' ' + (err.stack || '');
          else if (typeof err === 'object') {
            try {
              str = (err.message || '') + ' ' + (err.filename || '') + ' ' + JSON.stringify(err);
            } catch (e) {
              str = String(err);
            }
          }
          return (
            str.includes('WebSocket') ||
            str.includes('vite') ||
            str.includes('closed without opened') ||
            str.includes('@vite/client')
          );
        }

        window.addEventListener(
          'error',
          function (event) {
            if (isViteHmrError(event.error) || isViteHmrError(event.message) || isViteHmrError(event.filename)) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            if (isViteHmrError(event.reason)) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          },
          true
        );

        var _origConsoleError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          for (var i = 0; i < args.length; i++) {
            if (isViteHmrError(args[i])) return;
          }
          _origConsoleError.apply(console, arguments);
        };

        var _origConsoleWarn = console.warn;
        console.warn = function () {
          var args = Array.prototype.slice.call(arguments);
          for (var i = 0; i < args.length; i++) {
            if (isViteHmrError(args[i])) return;
          }
          _origConsoleWarn.apply(console, arguments);
        };

        // Neutralize Vite HMR WebSocket errors at source
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function (url, protocols) {
            var ws = new NativeWebSocket(url, protocols);
            if (protocols === 'vite-hmr' || (url && String(url).includes('vite'))) {
              ws.addEventListener('error', function (e) {
                e.stopImmediatePropagation();
              });
              ws.addEventListener('close', function (e) {
                e.stopImmediatePropagation();
              });
            }
            return ws;
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }
      })();
    </script>
